name = "tunnel-claude"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Demo boost: until BOOST_UNTIL these replace the caps below, then they fall back by themselves
BOOST_UNTIL = "2026-11-17T21:00:00Z"
BOOST_POOL_PER_HOUR = "150"
BOOST_PER_DAY = "400"
BOOST_PER_HOUR = "75"
BOOST_FUEL_PER_DAY = "3000"
# Comma-separated list of sites allowed to call this Worker
ALLOWED_ORIGINS = "https://samuelling.github.io"
# Cheaper/faster alternative: "claude-haiku-5-5"
MODEL = "claude-sonnet-5-5"
# New Claude designs per person per hour (counted in the visitor's browser); Warehouse objects are free
GEN_PER_HOUR = "20"
# Shared hourly pool of new designs for everyone (the "shred tickets" board)
GEN_POOL_PER_HOUR = "40"
# The Fabricator's daily cap; when it's spent the shop is CLOSED until 9 AM Eastern
GEN_PER_DAY = "150"
# Portal fuel: drop deliveries per day (Cloudflare's free KV allows 1,000 writes/day)
FUEL_PER_DAY = "600"

# 6 objects per visitor per minute
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# The portal's mailbox. Create it with:  wrangler kv namespace create DROPS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "DROPS"
id = "1911f17202244afeb8cc1726ae34e3f7"

# usage stats (js/stats.js → POST /hit; stats.html ← GET /stats): a SQLite-backed Durable Object
[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Stats"]
