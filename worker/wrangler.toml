name = "tunnel-claude"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Comma-separated list of sites allowed to call this Worker
ALLOWED_ORIGINS = "https://samuelling.github.io"
# Cheaper/faster alternative: "claude-haiku-5-5"
MODEL = "claude-sonnet-5-5"
# New Claude designs per person (IP) per hour; cached objects are free and don't count
GEN_PER_HOUR = "20"
# Shared hourly pool of new designs for everyone (the "shred tickets" board)
GEN_POOL_PER_HOUR = "40"

# 6 objects per visitor per minute
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }

# The portal's mailbox. Create it with:  wrangler kv namespace create DROPS
# then paste the id it prints here.
[[kv_namespaces]]
binding = "DROPS"
id = "1911f17202244afeb8cc1726ae34e3f7"
